<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            width: 350px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        .header {
            background: #1a73e8;
            color: white;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
        }
        .content {
            padding: 12px;
        }
        .api-config {
            margin-bottom: 12px;
        }
        .api-config label {
            display: block;
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }
        .api-config input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
        }
        .search-box {
            margin-bottom: 12px;
        }
        .search-box input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }
        .preguntas-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
        }
        .pregunta-item {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }
        .pregunta-item:hover {
            background: #e8f0fe;
        }
        .pregunta-item:last-child {
            border-bottom: none;
        }
        .pregunta-numero {
            font-weight: 600;
            color: #1a73e8;
            font-size: 12px;
        }
        .pregunta-titulo {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .remediaciones-list {
            margin-top: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            max-height: 200px;
            overflow-y: auto;
        }
        .remediacion-item {
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }
        .remediacion-item:hover {
            background: #e8f0fe;
        }
        .remediacion-item.selected {
            background: #d2e3fc;
        }
        .remediacion-numero {
            font-weight: 600;
            color: #1a73e8;
            font-size: 11px;
        }
        .remediacion-preview {
            font-size: 10px;
            color: #888;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-fill {
            width: 100%;
            padding: 10px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 12px;
        }
        .btn-fill:hover {
            background: #1557b0;
        }
        .btn-fill:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .error {
            color: #d32f2f;
            font-size: 12px;
            padding: 8px;
            background: #ffebee;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .empty {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">SCI Form Filler</div>
    <div class="content">
        <div class="api-config">
            <label>API URL</label>
            <input type="text" id="apiUrl" placeholder="http://127.0.0.1:8000" value="http://127.0.0.1:8000">
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar pregunta...">
        </div>
        
        <div id="preguntasList" class="preguntas-list"></div>
        
        <div id="remediacionesSection" style="display: none;">
            <div style="font-size: 11px; color: #666; margin: 12px 0 6px;">Selecciona una fila:</div>
            <div id="remediacionesList" class="remediaciones-list"></div>
            
            <button id="btnFill" class="btn-fill" disabled>Llenar Formulario</button>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
